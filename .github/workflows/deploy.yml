name: Deploy Slidev to GitHub Pages

on:
  # main への push で自動公開
  push:
    branches: [main]
  # 公開前に同じ build / QA 契約を PR 上でも検証
  pull_request:
  # 手動実行も可能
  workflow_dispatch:

# GitHub Pages へのデプロイに必要な権限
permissions:
  contents: read
  pages: write
  id-token: write

# 公開 run は維持し、PR 検証だけを最新 commit へ集約
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify GitHub Actions runtime majors
        run: npm run qa:action-runtimes

      - name: Verify agent context circuit breaker
        run: npm run qa:agent-context

      # base パスはリポジトリ名を自動注入（ハードコードしない）
      # 例: リポジトリが owner/my-repo なら base = /my-repo/
      - name: Build
        run: npm run build -- --base /${{ github.event.repository.name }}/ --out dist

      - name: Verify Reader View artifact
        run: |
          test -f dist/reader/index.html
          test -f dist/reader/reader-data.json
          ! grep -qi '<iframe' dist/reader/index.html
          test -f dist/reader/reader-manifest.json
          test ! -d dist/reader/images
          test -d dist/reader/thumbnails
          # scripts/build-reader.mjs が canonical 件数を検証するため、workflow は件数を重複管理しない。
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import path from 'node:path'

          const data = JSON.parse(fs.readFileSync('dist/reader/reader-data.json'))
          const manifest = JSON.parse(fs.readFileSync('dist/reader/reader-manifest.json'))
          if (data.version !== 2 || !Array.isArray(data.slides) || data.slides.length === 0)
            throw new Error('Reader data is missing its canonical slide mappings.')
          if (data.slides.some((slide, index) => slide.number !== index + 1
            || !slide.thumbnail
            || !fs.existsSync(path.join('dist/reader', slide.thumbnail))))
            throw new Error('Reader data has an invalid slide number or thumbnail mapping.')
          if (manifest.source !== 'slides.md'
            || !Array.isArray(manifest.slides)
            || manifest.slides.length !== data.slides.length)
            throw new Error('Reader manifest does not match the canonical Reader data.')
          if (manifest.slides.some((slide, index) => slide.number !== index + 1
            || !slide.note
            || !slide.type
            || !slide.variant))
            throw new Error('Reader manifest has an incomplete canonical slide mapping.')
          NODE
          test -f dist/reader-legacy/index.html
          test -f dist/reader-legacy/reader.js
          test -f dist/reader-pilot/index.html
          test -f dist/reader-pilot/coverage-report.json

      - name: Verify production surfaces
        run: npm run qa:production -- --base /${{ github.event.repository.name }}/ --out dist

      # Pilotの件数・構成契約は専用QAへ集約し、workflowとの二重管理を避ける。
      - name: Verify Reader pilot
        run: npm run qa:reader-pilot -- --base /${{ github.event.repository.name }}/ --out dist

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
